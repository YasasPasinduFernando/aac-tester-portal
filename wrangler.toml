name = "aac-tester-portal"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
GOOGLE_GROUP_EMAIL = "aac-sinhala-testers@googlegroups.com"
GOOGLE_GROUP_JOIN_URL = "https://groups.google.com/g/aac-sinhala-testers"
PLAY_TEST_JOIN_URL = "https://play.google.com/apps/testing/lk.aac.sinhala_tamil_english"
PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=lk.aac.sinhala_tamil_english"
TESTER_INACTIVITY_DAYS = "90"
ALLOWED_ORIGINS = "https://aac.yasaboy.com"
ENVIRONMENT = "production"

# PLAY_TEST_JOIN_URL and PLAY_STORE_URL are public Play links, set in [vars].
# RATE_LIMIT_SALT and Cloudflare Access values stay Worker secrets.
# GOOGLE_CLIENT_ID is public (GIS). Set as a var or secret after creating the OAuth client.
# SESSION_SECRET is private: npx wrangler secret put SESSION_SECRET

[[d1_databases]]
binding = "DB"
database_name = "aac-tester-portal"
database_id = "f9f042f3-72d1-4c4c-b724-767e385b66ae"

[triggers]
crons = ["0 3 * * *"]

[[routes]]
pattern = "aac.yasaboy.com"
custom_domain = true

[observability]
enabled = true
