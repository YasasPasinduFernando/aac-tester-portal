name = "aac-tester-portal"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
GOOGLE_GROUP_EMAIL = "aac-sinhala-testers@googlegroups.com"
GOOGLE_GROUP_JOIN_URL = "https://groups.google.com/g/aac-sinhala-testers"
TESTER_INACTIVITY_DAYS = "90"
ALLOWED_ORIGINS = "https://aac.yasaboy.com"
ENVIRONMENT = "production"

# PLAY_TEST_JOIN_URL, RATE_LIMIT_SALT, optional APPS_SCRIPT_* and
# Cloudflare Access values are Worker secrets / dashboard vars.
# Do not commit a real Play opt-in URL unless it is meant to be public.

[[d1_databases]]
binding = "DB"
database_name = "aac-tester-portal"
database_id = "f9f042f3-72d1-4c4c-b724-767e385b66ae"

[triggers]
crons = ["0 3 * * *"]

[[routes]]
pattern = "aac.yasaboy.com"
custom_domain = true

[observability]
enabled = true
